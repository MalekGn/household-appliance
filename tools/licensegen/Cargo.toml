[package]
name = "licensegen"
version = "0.1.0"
edition = "2021"
description = "Offline license issuer for paymentSchedule — signs machine-bound, time-limited certification files. NOT shipped with the app."
publish = false

# Standalone tool, intentionally NOT part of the app's Cargo workspace so the
# signing code and its deps never end up in the shipped binary. Run it from this
# directory: `cargo run -- keygen` / `cargo run -- issue ...`.

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
